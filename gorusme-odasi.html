<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UzmanOda | Görüşme Odası</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #7B2CBF; --purple-light: #F3E8FF; --text-light: #F9FAFB;
            --danger: #EF4444; --success: #10B981; --bg-dark: #0F172A; 
            --surface-dark: #1E293B; --radius-lg: 24px; --radius-md: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        html, body { overflow: hidden; height: 100vh; background-color: var(--bg-dark); color: var(--text-light); }

        .video-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #000; }

        .local-video-container {
            position: absolute; bottom: 100px; right: 30px; width: 180px; height: 120px;
            border-radius: var(--radius-md); overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.2); background: #000; z-index: 10; transition: 0.3s;
        }
        #localVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        .top-bar {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; pointer-events: none; 
        }
        .room-info {
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px);
            padding: 10px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; gap: 12px; pointer-events: auto;
        }
        .room-code { font-weight: 800; letter-spacing: 1px; color: var(--primary); }
        .timer { font-size: 14px; color: #9CA3AF; font-variant-numeric: tabular-nums; }

        .controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px);
            padding: 15px 30px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); z-index: 10;
        }
        .control-btn {
            width: 56px; height: 56px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.1); color: white; font-size: 24px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .control-btn:hover { background: rgba(255,255,255,0.2); }
        .control-btn.active { background: var(--primary); }
        .control-btn.danger { background: var(--danger); }
        
        .sidebar {
            position: absolute; top: 0; right: -400px; width: 380px; height: 100vh;
            background: var(--surface-dark); border-left: 1px solid rgba(255,255,255,0.1);
            z-index: 20; transition: right 0.3s ease; display: flex; flex-direction: column;
        }
        .sidebar.open { right: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .close-sidebar { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { background: rgba(255,255,255,0.05); padding: 12px 16px; border-radius: 12px; max-width: 85%; }
        .message.mine { background: var(--primary); align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-input-area { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px 16px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; outline: none; }
        .btn-send { background: var(--primary); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        @media (max-width: 768px) {
            .local-video-container { width: 120px; height: 160px; bottom: 90px; right: 15px; }
            .controls { padding: 10px 20px; gap: 10px; width: 95%; justify-content: center; }
            .control-btn { width: 48px; height: 48px; font-size: 20px; }
            .sidebar { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="local-video-container">
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <div class="top-bar">
            <div class="room-info">
                <i class="ph ph-video-camera" style="color: var(--primary); font-size: 20px;"></i>
                <span class="room-code" id="odaKoduEkran">Oda Yükleniyor...</span>
                <span class="timer" id="sure">00:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" id="micBtn" onclick="toggleMic()"><i class="ph ph-microphone"></i></button>
            <button class="control-btn" id="camBtn" onclick="toggleCam()"><i class="ph ph-video-camera"></i></button>
            <button class="control-btn" id="chatBtn" onclick="toggleChat()"><i class="ph ph-chat-teardrop-text"></i></button>
            <button class="control-btn danger" onclick="gorusmeyiBitir()"><i class="ph ph-phone-disconnect"></i></button>
        </div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>Görüşme Sohbeti</h3>
                <button class="close-sidebar" onclick="toggleChat()">&times;</button>
            </div>
            <div class="chat-area" id="chatArea">
                <div class="message theirs">Merhaba, görüşmeye bağlandınız.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Mesaj yazın..." onkeypress="if(event.key === 'Enter') mesajGonder()">
                <button class="btn-send" onclick="mesajGonder()"><i class="ph ph-paper-plane-right"></i></button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCd0Qlv5o4iszdXoafF2w5UA8n5ZQMQK58",
            authDomain: "uzmanoda.firebaseapp.com",
            projectId: "uzmanoda",
            storageBucket: "uzmanoda.firebasestorage.app",
            messagingSenderId: "71880478784",
            appId: "1:71880478784:web:6934d6ebfd49d46d51cfa5"
        };

        // TURN SUNUCU
        const iceServers = {
            iceServers: [
                { urls: "stun:stun.relay.metered.ca:80" },
                { urls: "turn:global.relay.metered.ca:80", username: "f987b1568451597d97387c26", credential: "mq65sbWBbmx/e70b" },
                { urls: "turn:global.relay.metered.ca:80?transport=tcp", username: "f987b1568451597d97387c26", credential: "mq65sbWBbmx/e70b" },
                { urls: "turn:global.relay.metered.ca:443", username: "f987b1568451597d97387c26", credential: "mq65sbWBbmx/e70b" },
                { urls: "turns:global.relay.metered.ca:443?transport=tcp", username: "f987b1568451597d97387c26", credential: "mq65sbWBbmx/e70b" }
            ]
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let localStream, peerConnection;
        let odaKodu, isHost = false, currentUser = null;
        let sureInterval, saniye = 0;
        let unsubOffer, unsubAnswer, unsubCandidates;
        
        // KRİTİK: Geç gelen ICE adaylarını tutacağımız havuz
        let pendingCandidates = [];

        const urlParams = new URLSearchParams(window.location.search);
        odaKodu = urlParams.get('oda');

        if (!odaKodu) {
            alert("Oda kodu bulunamadı! Ana sayfaya dönüyorsunuz.");
            window.location.href = "index.html";
        }

        document.getElementById('odaKoduEkran').innerText = "Oda: " + odaKodu;

        // --- 1. BAŞLATMA ---
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "danisan-giris.html";
                return;
            }
            currentUser = user;
            
            // Kim olduğunu kontrol et (Uzman mı?)
            try {
                const uzmanDoc = await db.collection('uzmanlar').doc(user.uid).get();
                if (uzmanDoc.exists) {
                    isHost = true;
                    console.log("Rol: UZMAN (Host)");
                } else {
                    console.log("Rol: DANIŞAN (Guest)");
                }
            } catch(e) { console.log(e); }

            await kamerayiBaslat();
            baglantiKur();
        });

        // --- 2. KAMERA ---
        async function kamerayiBaslat() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                console.log("Kamera başarıyla başlatıldı.");
            } catch (err) {
                alert("Kamera açılamadı. İzin verdiğinizden emin olun.");
                console.error(err);
            }
        }

        // --- 3. WEBRTC ---
        function baglantiKur() {
            peerConnection = new RTCPeerConnection(iceServers);
            console.log("RTCPeerConnection oluşturuldu.");

            // A. Karşı tarafın videosu geldiğinde
            peerConnection.ontrack = (event) => {
                console.log("KARŞI TARAFIN VİDEOSU GELDİ!");
                const remoteVideo = document.getElementById('remoteVideo');
                if (remoteVideo.srcObject !== event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                }
            };

            // B. Kendi ICE adaylarımızı gönder
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    db.collection('gorusmeler').doc(odaKodu).collection('adaylar').add({
                        candidate: event.candidate,
                        gonderen: isHost ? 'host' : 'guest'
                    });
                }
            };

            // C. Bağlantı durumunu izle
            peerConnection.onconnectionstatechange = () => {
                console.log("Bağlantı Durumu:", peerConnection.connectionState);
            };

            // D. Medyayı ekle
            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            // E. SİNYALLEŞME
            if (isHost) {
                // 1. Cevabı (Answer) dinle
                unsubAnswer = db.collection('gorusmeler').doc(odaKodu).onSnapshot(snapshot => {
                    const data = snapshot.data();
                    if (data && data.answer && !peerConnection.currentRemoteDescription) {
                        console.log("Danışandan cevap (Answer) geldi, kaydediliyor...");
                        peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer))
                        .then(() => {
                            // Cevap geldikten sonra biriken ICE adaylarını ekle
                            pendingCandidates.forEach(c => peerConnection.addIceCandidate(c).catch(e => console.log("Aday ekleme hatası:", e)));
                            pendingCandidates = [];
                        });
                    }
                });

                // 2. Teklifi (Offer) oluştur ve gönder
                setTimeout(async () => {
                    try {
                        const offer = await peerConnection.createOffer();
                        await peerConnection.setLocalDescription(offer);
                        console.log("Uzman teklifi (Offer) gönderiyor...");
                        
                        await db.collection('gorusmeler').doc(odaKodu).set({
                            offer: { type: offer.type, sdp: offer.sdp },
                            hostId: currentUser.uid,
                            odaKodu: odaKodu,
                            olusturmaTarihi: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } catch(e) { console.error("Offer hatası:", e); }
                }, 1000); // 1 saniye bekle (bağlantı stabilleşsin)

            } else {
                // DANIŞAN
                unsubOffer = db.collection('gorusmeler').doc(odaKodu).onSnapshot(async snapshot => {
                    const data = snapshot.data();
                    if (data && data.offer && !peerConnection.currentRemoteDescription) {
                        console.log("Uzmandan teklif (Offer) geldi, cevap hazırlanıyor...");
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                        
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        
                        await db.collection('gorusmeler').doc(odaKodu).update({
                            answer: { type: answer.type, sdp: answer.sdp }
                        });
                        
                        // Cevap gönderildikten sonra biriken ICE adaylarını ekle
                        pendingCandidates.forEach(c => peerConnection.addIceCandidate(c).catch(e => console.log("Aday ekleme hatası:", e)));
                        pendingCandidates = [];
                    }
                });
            }

            // F. Karşı tarafın ICE adaylarını dinle
            unsubCandidates = db.collection('gorusmeler').doc(odaKodu).collection('adaylar').onSnapshot(snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const data = change.doc.data();
                        if (data.gonderen !== (isHost ? 'host' : 'guest')) {
                            const candidate = new RTCIceCandidate(data.candidate);
                            
                            // EĞER KARŞI TARAF HENÜZ TANIMLI DEĞİLSE HAVUZA AT
                            if (peerConnection.remoteDescription) {
                                peerConnection.addIceCandidate(candidate).catch(e => console.log("Aday ekleme hatası:", e));
                            } else {
                                pendingCandidates.push(candidate);
                            }
                        }
                    }
                });
            });

            // G. Süre
            sureInterval = setInterval(() => {
                saniye++;
                let dk = Math.floor(saniye / 60).toString().padStart(2, '0');
                let sn = (saniye % 60).toString().padStart(2, '0');
                document.getElementById('sure').innerText = `${dk}:${sn}`;
            }, 1000);
        }

        // --- KONTROLLER ---
        function toggleMic() {
            const btn = document.getElementById('micBtn');
            const audioTrack = localStream.getAudioTracks()[0];
            audioTrack.enabled = !audioTrack.enabled;
            btn.classList.toggle('active', !audioTrack.enabled);
            btn.innerHTML = audioTrack.enabled ? '<i class="ph ph-microphone"></i>' : '<i class="ph ph-microphone-slash"></i>';
        }
        function toggleCam() {
            const btn = document.getElementById('camBtn');
            const videoTrack = localStream.getVideoTracks()[0];
            videoTrack.enabled = !videoTrack.enabled;
            btn.classList.toggle('active', !videoTrack.enabled);
            btn.innerHTML = videoTrack.enabled ? '<i class="ph ph-video-camera"></i>' : '<i class="ph ph-video-camera-slash"></i>';
        }
        function toggleChat() { document.getElementById('sidebar').classList.toggle('open'); }
        function mesajGonder() {
            const input = document.getElementById('chatInput');
            if(input.value.trim() === "") return;
            const chatArea = document.getElementById('chatArea');
            const msg = document.createElement('div');
            msg.className = 'message mine';
            msg.innerText = input.value;
            chatArea.appendChild(msg);
            input.value = "";
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function gorusmeyiBitir() {
            if(confirm("Görüşmeyi bitirmek istediğinize emin misiniz?")) {
                if(peerConnection) peerConnection.close();
                if(localStream) localStream.getTracks().forEach(track => track.stop());
                clearInterval(sureInterval);
                if(unsubOffer) unsubOffer();
                if(unsubAnswer) unsubAnswer();
                if(unsubCandidates) unsubCandidates();
                db.collection('gorusmeler').doc(odaKodu).delete().catch(e => console.log(e));
                
                if(isHost) window.location.href = "uzman-panel.html";
                else window.location.href = "danisan-panel.html";
            }
        }
    </script>
</body>
</html>
