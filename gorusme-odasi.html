<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UzmanOda | Görüşme Odası</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #7B2CBF; --danger: #EF4444; --success: #10B981; 
            --bg-dark: #0F172A; --surface-dark: #1E293B;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        html, body { overflow: hidden; height: 100vh; background-color: var(--bg-dark); color: white; }

        .video-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #000; }

        .local-video-container {
            position: absolute; bottom: 100px; right: 30px; width: 180px; height: 120px;
            border-radius: 12px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.2); background: #000; z-index: 10;
        }
        #localVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* DEBUG KUTUSU */
        .debug-box {
            position: absolute; top: 20px; left: 20px; 
            background: rgba(0, 0, 0, 0.85); border: 1px solid var(--primary);
            padding: 15px; border-radius: 8px; font-size: 12px; font-family: monospace;
            z-index: 9999; max-width: 300px; max-height: 300px; overflow-y: auto;
        }
        .debug-box h4 { color: var(--primary); margin-bottom: 5px; }
        .debug-box p { margin-bottom: 3px; color: #ccc; }

        .conn-status {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); color: white; padding: 8px 16px; border-radius: 20px;
            font-size: 13px; font-weight: 600; z-index: 10; display: flex; align-items: center; gap: 8px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: orange; }
        .dot.connected { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .dot.failed { background: var(--danger); }

        .controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; background: rgba(30, 41, 59, 0.8);
            padding: 15px 30px; border-radius: 50px; z-index: 10;
        }
        .control-btn { width: 56px; height: 56px; border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: white; font-size: 24px; cursor: pointer; }
        .control-btn.danger { background: var(--danger); }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="local-video-container">
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <div class="debug-box">
            <h4>Sistem Durumu</h4>
            <p id="log1">Başlatılıyor...</p>
            <p id="log2"></p>
            <p id="log3"></p>
            <p id="log4"></p>
            <p id="log5"></p>
        </div>

        <div class="conn-status">
            <div class="dot" id="connDot"></div>
            <span id="connText">Bağlanılıyor...</span>
        </div>

        <div class="controls">
            <button class="control-btn" id="micBtn" onclick="toggleMic()"><i class="ph ph-microphone"></i></button>
            <button class="control-btn" id="camBtn" onclick="toggleCam()"><i class="ph ph-video-camera"></i></button>
            <button class="control-btn danger" onclick="gorusmeyiBitir()"><i class="ph ph-phone-disconnect"></i></button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCd0Qlv5o4iszdXoafF2w5UA8n5ZQMQK58",
            authDomain: "uzmanoda.firebaseapp.com",
            projectId: "uzmanoda",
            storageBucket: "uzmanoda.firebasestorage.app",
            messagingSenderId: "71880478784",
            appId: "1:71880478784:web:6934d6ebfd49d46d51cfa5"
        };

        const iceServers = {
            iceServers: [
                { urls: "stun:stun.relay.metered.ca:80" },
                { urls: "turn:global.relay.metered.ca:80", username: "f987b1568451597d97387c26", credential: "mq65sbWBbmx/e70b" },
                { urls: "turn:global.relay.metered.ca:443", username: "f987b1568451597d97387c26", credential: "mq65sbWBbmx/e70b" }
            ]
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let localStream, peerConnection, odaKodu, isHost = false, currentUser = null;
        let pendingCandidates = [];
        let logCounter = 1;

        function ekranaYaz(mesaj) {
            console.log(mesaj);
            if (logCounter <= 5) {
                const p = document.getElementById('log' + logCounter);
                if(p) p.innerText = "> " + mesaj;
                logCounter++;
            }
        }

        function updateStatus(text, state) {
            document.getElementById('connText').innerText = text;
            const dot = document.getElementById('connDot');
            dot.className = 'dot';
            if (state === 'connected') dot.classList.add('connected');
            if (state === 'failed') dot.classList.add('failed');
        }

        const urlParams = new URLSearchParams(window.location.search);
        odaKodu = urlParams.get('oda');

        if (!odaKodu) {
            alert("Oda kodu yok!");
            window.location.href = "index.html";
        }

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "danisan-giris.html";
                return;
            }
            currentUser = user;
            
            try {
                const uzmanDoc = await db.collection('uzmanlar').doc(user.uid).get();
                isHost = uzmanDoc.exists;
                ekranaYaz(isHost ? "Rol: UZMAN" : "Rol: DANIŞAN");
            } catch(e) { ekranaYaz("Rol belirlenemedi"); }

            await kamerayiBaslat();
            baglantiKur();
        });

        async function kamerayiBaslat() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                ekranaYaz("Kamera açıldı");
            } catch (err) {
                ekranaYaz("HATA: Kamera açılamadı!");
            }
        }

        function baglantiKur() {
            peerConnection = new RTCPeerConnection(iceServers);

            peerConnection.ontrack = (event) => {
                ekranaYaz("Karşı taraf videosu GELDİ!");
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                // Tarayıcı sesi engelliyorsa otomatik oynatmayı zorla
                document.getElementById('remoteVideo').play().catch(e => console.log(e));
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    db.collection('gorusmeler').doc(odaKodu).collection('adaylar').add({
                        candidate: event.candidate,
                        gonderen: isHost ? 'host' : 'guest'
                    }).catch(e => ekranaYaz("Firebase Aday Hatası!"));
                }
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'connected') {
                    updateStatus("Bağlandı", "connected");
                    ekranaYaz("Bağlantı Başarılı!");
                } else if (peerConnection.connectionState === 'failed') {
                    updateStatus("Bağlantı Koptu", "failed");
                    ekranaYaz("Bağlantı Başarısız!");
                }
            };

            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            if (isHost) {
                // UZMAN: Cevap bekle
                db.collection('gorusmeler').doc(odaKodu).onSnapshot(snapshot => {
                    const data = snapshot.data();
                    if (data && data.answer && !peerConnection.currentRemoteDescription) {
                        ekranaYaz("Danışandan cevap alındı");
                        peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer))
                        .then(() => {
                            pendingCandidates.forEach(c => peerConnection.addIceCandidate(c).catch(e => {}));
                            pendingCandidates = [];
                        })
                        .catch(e => ekranaYaz("HATA: Cevap eklenemedi"));
                    }
                });

                // UZMAN: Teklif gönder
                setTimeout(async () => {
                    try {
                        const offer = await peerConnection.createOffer();
                        await peerConnection.setLocalDescription(offer);
                        
                        ekranaYaz("Teklif Firebase'e yazılıyor...");
                        await db.collection('gorusmeler').doc(odaKodu).set({
                            offer: { type: offer.type, sdp: offer.sdp },
                            hostId: currentUser.uid
                        });
                        ekranaYaz("Teklif Gönderildi");
                    } catch(e) { ekranaYaz("HATA: Teklif oluşturulamadı"); }
                }, 1500);

            } else {
                // DANIŞAN: Teklif bekle
                db.collection('gorusmeler').doc(odaKodu).onSnapshot(async snapshot => {
                    const data = snapshot.data();
                    if (data && data.offer && !peerConnection.currentRemoteDescription) {
                        ekranaYaz("Uzmandan teklif alındı");
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                        
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        
                        await db.collection('gorusmeler').doc(odaKodu).update({
                            answer: { type: answer.type, sdp: answer.sdp }
                        });
                        ekranaYaz("Cevap Gönderildi");
                        
                        pendingCandidates.forEach(c => peerConnection.addIceCandidate(c).catch(e => {}));
                        pendingCandidates = [];
                    }
                });
            }

            // ICE Adaylarını dinle
            db.collection('gorusmeler').doc(odaKodu).collection('adaylar').onSnapshot(snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const data = change.doc.data();
                        if (data.gonderen !== (isHost ? 'host' : 'guest')) {
                            const candidate = new RTCIceCandidate(data.candidate);
                            if (peerConnection.remoteDescription) {
                                peerConnection.addIceCandidate(candidate).catch(e => {});
                            } else {
                                pendingCandidates.push(candidate);
                            }
                        }
                    }
                });
            });
        }

        function toggleMic() { const t = localStream.getAudioTracks()[0]; t.enabled = !t.enabled; }
        function toggleCam() { const t = localStream.getVideoTracks()[0]; t.enabled = !t.enabled; }

        function gorusmeyiBitir() {
            if(confirm("Görüşmeyi bitirmek istiyor musunuz?")) {
                if(peerConnection) peerConnection.close();
                if(localStream) localStream.getTracks().forEach(track => track.stop());
                db.collection('gorusmeler').doc(odaKodu).delete().catch(e => {});
                window.location.href = isHost ? "uzman-panel.html" : "danisan-panel.html";
            }
        }
    </script>
</body>
</html>
