<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UzmanOda | Görüşme Odası</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #7B2CBF; --danger: #EF4444; --success: #10B981; 
            --bg-dark: #0F172A;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        html, body { overflow: hidden; height: 100vh; background-color: var(--bg-dark); color: white; }

        .video-wrapper { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        /* Karşı taraf videosu (Başlangıçta otomatik oynatma engelini aşmak için tıklama dinleyicisi var) */
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #000; cursor: pointer; }

        .local-video-container {
            position: absolute; bottom: 100px; right: 30px; width: 180px; height: 120px;
            border-radius: 12px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.2); background: #000; z-index: 10;
        }
        #localVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* Ses Açma Uyarısı */
        .unmute-alert {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); padding: 20px 40px; border-radius: 12px;
            text-align: center; z-index: 50; cursor: pointer; display: none;
            border: 2px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: pulse 2s infinite;
        }
        .unmute-alert i { font-size: 40px; color: var(--primary); margin-bottom: 10px; display: block; }
        .unmute-alert h3 { font-size: 18px; margin-bottom: 5px; }
        .unmute-alert p { font-size: 14px; color: #ccc; }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .conn-status {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); color: white; padding: 8px 16px; border-radius: 20px;
            font-size: 13px; font-weight: 600; z-index: 10; display: flex; align-items: center; gap: 8px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: orange; }
        .dot.connected { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .dot.failed { background: var(--danger); }

        .controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; background: rgba(30, 41, 59, 0.8);
            padding: 15px 30px; border-radius: 50px; z-index: 10;
        }
        .control-btn { width: 56px; height: 56px; border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: white; font-size: 24px; cursor: pointer; }
        .control-btn.danger { background: var(--danger); }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <!-- Karşı tarafın videosu (Otomatik oynatma için muted eklendi) -->
        <video id="remoteVideo" autoplay playsinline muted></video>

        <div class="local-video-container">
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <!-- Ses açma butonu (Eğer otomatik başlamazsa) -->
        <div class="unmute-alert" id="unmuteAlert" onclick="sesiAc()">
            <i class="ph ph-speaker-high"></i>
            <h3>Görüşmeye Bağlandınız!</h3>
            <p>Sesi duymak için buraya tıklayın</p>
        </div>

        <div class="conn-status">
            <div class="dot" id="connDot"></div>
            <span id="connText">Bağlanılıyor...</span>
        </div>

        <div class="controls">
            <button class="control-btn" id="micBtn" onclick="toggleMic()"><i class="ph ph-microphone"></i></button>
            <button class="control-btn" id="camBtn" onclick="toggleCam()"><i class="ph ph-video-camera"></i></button>
            <button class="control-btn danger" onclick="gorusmeyiBitir()"><i class="ph ph-phone-disconnect"></i></button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCd0Qlv5o4iszdXoafF2w5UA8n5ZQMQK58",
            authDomain: "uzmanoda.firebaseapp.com",
            projectId: "uzmanoda",
            storageBucket: "uzmanoda.firebasestorage.app",
            messagingSenderId: "71880478784",
            appId: "1:71880478784:web:6934d6ebfd49d46d51cfa5"
        };

        const iceServers = {
            iceServers: [
                { urls: "stun:stun.relay.metered.ca:80" },
                { urls: "turn:global.relay.metered.ca:80", username: "f987b1568451597d97387c26", credential: "mq65sbWBbmx/e70b" },
                { urls: "turn:global.relay.metered.ca:443", username: "f987b1568451597d97387c26", credential: "mq65sbWBbmx/e70b" }
            ]
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let localStream, peerConnection, odaKodu, isHost = false, currentUser = null;
        let pendingCandidates = [];

        function updateStatus(text, state) {
            document.getElementById('connText').innerText = text;
            const dot = document.getElementById('connDot');
            dot.className = 'dot';
            if (state === 'connected') dot.classList.add('connected');
            if (state === 'failed') dot.classList.add('failed');
        }

        const urlParams = new URLSearchParams(window.location.search);
        odaKodu = urlParams.get('oda');

        if (!odaKodu) {
            alert("Oda kodu yok!");
            window.location.href = "index.html";
        }

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "danisan-giris.html";
                return;
            }
            currentUser = user;
            
            try {
                const uzmanDoc = await db.collection('uzmanlar').doc(user.uid).get();
                isHost = uzmanDoc.exists;
            } catch(e) { console.log("Rol belirlenemedi"); }

            await kamerayiBaslat();
            baglantiKur();
        });

        async function kamerayiBaslat() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (err) {
                alert("Kamera açılamadı!");
            }
        }

        function baglantiKur() {
            peerConnection = new RTCPeerConnection(iceServers);

            // Karşı taraftan video geldiğinde
            peerConnection.ontrack = (event) => {
                console.log("Karşı taraf videosu geldi!");
                const remoteVideo = document.getElementById('remoteVideo');
                remoteVideo.srcObject = event.streams[0];
                
                // Tarayıcıya "oynat" komutu ver
                remoteVideo.play().then(() => {
                    // Eğer video sessiz (muted) olarak başladıysa, kullanıcıya bildir
                    if(remoteVideo.muted) {
                        document.getElementById('unmuteAlert').style.display = 'block';
                    }
                }).catch(e => {
                    console.log("Otomatik oynatma engellendi, kullanıcı etkileşimi bekleniyor.");
                    document.getElementById('unmuteAlert').style.display = 'block';
                });
            };

            // Ağ adaylarını kaydet
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    db.collection('gorusmeler').doc(odaKodu).collection('adaylar').add({
                        candidate: event.candidate,
                        gonderen: isHost ? 'host' : 'guest'
                    });
                }
            };

            // Bağlantı durumunu izle
            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'connected') {
                    updateStatus("Bağlandı", "connected");
                    // Ses açma uyarısını göster
                    document.getElementById('unmuteAlert').style.display = 'block';
                } else if (peerConnection.connectionState === 'failed') {
                    updateStatus("Bağlantı Koptu", "failed");
                }
            };

            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            if (isHost) {
                db.collection('gorusmeler').doc(odaKodu).onSnapshot(snapshot => {
                    const data = snapshot.data();
                    if (data && data.answer && !peerConnection.currentRemoteDescription) {
                        peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer))
                        .then(() => {
                            pendingCandidates.forEach(c => peerConnection.addIceCandidate(c).catch(e => {}));
                            pendingCandidates = [];
                        });
                    }
                });

                setTimeout(async () => {
                    try {
                        const offer = await peerConnection.createOffer();
                        await peerConnection.setLocalDescription(offer);
                        await db.collection('gorusmeler').doc(odaKodu).set({
                            offer: { type: offer.type, sdp: offer.sdp },
                            hostId: currentUser.uid
                        });
                    } catch(e) { console.log("Offer hatası"); }
                }, 1000);

            } else {
                db.collection('gorusmeler').doc(odaKodu).onSnapshot(async snapshot => {
                    const data = snapshot.data();
                    if (data && data.offer && !peerConnection.currentRemoteDescription) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        await db.collection('gorusmeler').doc(odaKodu).update({
                            answer: { type: answer.type, sdp: answer.sdp }
                        });
                        pendingCandidates.forEach(c => peerConnection.addIceCandidate(c).catch(e => {}));
                        pendingCandidates = [];
                    }
                });
            }

            db.collection('gorusmeler').doc(odaKodu).collection('adaylar').onSnapshot(snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const data = change.doc.data();
                        if (data.gonderen !== (isHost ? 'host' : 'guest')) {
                            const candidate = new RTCIceCandidate(data.candidate);
                            if (peerConnection.remoteDescription) {
                                peerConnection.addIceCandidate(candidate).catch(e => {});
                            } else {
                                pendingCandidates.push(candidate);
                            }
                        }
                    }
                });
            });
        }

        // Ses açma fonksiyonu (Ekrana tıklandığında çalışır)
        function sesiAc() {
            const remoteVideo = document.getElementById('remoteVideo');
            remoteVideo.muted = false; // Sesi aç
            remoteVideo.play(); // Oynatmayı zorla
            document.getElementById('unmuteAlert').style.display = 'none'; // Uyarıyı gizle
        }

        function toggleMic() { const t = localStream.getAudioTracks()[0]; t.enabled = !t.enabled; }
        function toggleCam() { const t = localStream.getVideoTracks()[0]; t.enabled = !t.enabled; }

        function gorusmeyiBitir() {
            if(confirm("Görüşmeyi bitirmek istiyor musunuz?")) {
                if(peerConnection) peerConnection.close();
                if(localStream) localStream.getTracks().forEach(track => track.stop());
                db.collection('gorusmeler').doc(odaKodu).delete().catch(e => {});
                window.location.href = isHost ? "uzman-panel.html" : "danisan-panel.html";
            }
        }
    </script>
</body>
</html>
