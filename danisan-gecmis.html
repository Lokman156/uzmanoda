<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UzmanOda | Geçmiş Görüşmelerim</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root {
            --primary: #7B2CBF; 
            --pink-light: #FDF2F8;
            --purple-light: #F3E8FF;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
            --surface: #FFFFFF;
            --border: #E5E7EB;
            --success: #10B981;
            --danger: #EF4444;
            --radius-lg: 24px;
            --radius-md: 12px;
            --nav-height: 70px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        html, body { overflow-x: hidden; background-color: #FAFAFA; color: var(--text-dark); min-height: 100vh; }
        .top-navbar { position: fixed; top: 0; left: 0; width: 100%; height: var(--nav-height); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 24px; z-index: 1000; }
        .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--primary); font-size: 22px; font-weight: 800; }
        .nav-logo img { height: 36px; border-radius: 8px; }
        .nav-actions { display: flex; align-items: center; gap: 16px; }
        .notif-btn { position: relative; background: transparent; border: none; font-size: 24px; color: var(--text-dark); cursor: pointer; padding: 8px; border-radius: 50%; transition: 0.2s; }
        .notif-btn:hover { background: var(--purple-light); color: var(--primary); }
        .notif-badge { position: absolute; top: 2px; right: 2px; background: var(--danger); color: white; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 10px; min-width: 18px; text-align: center; display: none; }
        .notif-badge.show { display: block; }
        .user-info-nav { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 10px; border-radius: 20px; transition: 0.2s; }
        .user-info-nav:hover { background: var(--purple-light); }
        .avatar-nav { width: 36px; height: 36px; background: var(--purple-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; overflow: hidden; }
        .avatar-nav img { width: 100%; height: 100%; object-fit: cover; }
        .user-name { font-size: 15px; font-weight: 700; }
        .btn-logout { display: flex; align-items: center; gap: 6px; background: #FEE2E2; color: var(--danger); border: none; padding: 8px 16px; border-radius: var(--radius-md); font-weight: 700; font-size: 14px; cursor: pointer; }
        .btn-logout:hover { background: var(--danger); color: white; }
        .app-body { display: flex; margin-top: var(--nav-height); min-height: calc(100vh - var(--nav-height)); }
        .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px; position: fixed; top: var(--nav-height); bottom: 0; left: 0; z-index: 100; overflow-y: auto; }
        .nav-menu { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 13px 16px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 15px; border-radius: var(--radius-md); transition: 0.2s; position: relative; }
        .nav-link:hover, .nav-link.active { background: var(--purple-light); color: var(--primary); }
        .nav-link i { font-size: 20px; }
        .nav-link .menu-badge { margin-left: auto; background: var(--danger); color: white; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 10px; }
        .main-wrapper { flex: 1; margin-left: 260px; padding: 40px; background: linear-gradient(135deg, #FDF2F8 0%, #F3E8FF 100%); min-height: calc(100vh - var(--nav-height)); }
        .panel-container { max-width: 1000px; margin: 0 auto; }
        .page-header { margin-bottom: 24px; }
        .page-title h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
        .page-title p { color: var(--text-muted); font-size: 15px; }
        
        /* Filtre Bar */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filter-bar select, .filter-bar input { padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 14px; outline: none; background: white; font-family: inherit; }
        .filter-bar select:focus, .filter-bar input:focus { border-color: var(--primary); }
        .search-input-wrap { flex: 1; min-width: 200px; position: relative; }
        .search-input-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 18px; pointer-events: none; }
        .search-input-wrap input { width: 100%; padding-left: 42px; }
        
        .history-container { display: flex; flex-direction: column; gap: 16px; }
        .history-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; gap: 16px; }
        .history-card:hover { border-color: var(--primary); box-shadow: 0 4px 12px rgba(123, 44, 191, 0.05); }
        .history-info { display: flex; align-items: center; gap: 16px; }
        .history-icon { width: 50px; height: 50px; background: var(--purple-light); color: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .history-details h4 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .history-details p { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 12px; }
        .history-meta { text-align: right; flex-shrink: 0; }
        .history-meta .date { font-size: 14px; font-weight: 700; display: block; margin-bottom: 4px; }
        .history-meta .duration { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
        .status-badge { background: #D1FAE5; color: var(--success); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-left: 20px; flex-shrink: 0; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); background: var(--surface); border-radius: var(--radius-lg); border: 1px dashed var(--border); }
        .empty-state i { font-size: 50px; opacity: 0.3; margin-bottom: 15px; display: block; }
        .result-count { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; font-weight: 600; }
        
        @media (max-width: 768px) {
            .top-navbar { padding: 0 12px; }
            .user-name { display: none; }
            .btn-logout { padding: 8px 10px; font-size: 12px; }
            .nav-actions { gap: 8px; }
            .app-body { flex-direction: column; }
            .sidebar { width: 100%; height: 70px; position: fixed; bottom: 0; top: auto; flex-direction: row; justify-content: space-around; align-items: center; padding: 8px 5px; border-right: none; border-top: 1px solid var(--border); background: rgba(255,255,255,0.97); z-index: 1000; overflow-x: auto; overflow-y: hidden; }
            .nav-menu { flex-direction: row; gap: 0; width: 100%; justify-content: space-around; }
            .nav-link { flex-direction: column; padding: 6px 4px; font-size: 10px; gap: 2px; text-align: center; margin-bottom: 0; min-width: 0; }
            .nav-link i { font-size: 22px; }
            .nav-link .menu-badge { position: absolute; top: 2px; right: 8px; margin-left: 0; }
            .main-wrapper { margin-left: 0; padding: 20px; padding-bottom: 90px; }
            .history-card { flex-direction: column; align-items: flex-start; }
            .history-meta { text-align: left; width: 100%; display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border); padding-top: 12px; }
            .status-badge { margin-left: 0; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-bar select { width: 100%; }
        }
    </style>
</head>
<body>

    <header class="top-navbar">
        <a href="index.html" class="nav-logo">
            <img src="https://i.hizliresim.com/ujivotuh.png" alt="UzmanOda">
            UzmanOda
        </a>
        <div class="nav-actions">
            <button class="notif-btn" onclick="window.location.href='bildirimler.html'" title="Bildirimler">
                <i class="ph ph-bell"></i>
                <span class="notif-badge" id="notifBadge">0</span>
            </button>
            <div class="user-info-nav" onclick="window.location.href='danisan-profil.html'">
                <div class="avatar-nav" id="profilAvatar">D</div>
                <span class="user-name" id="profilIsim">Yükleniyor...</span>
            </div>
            <button onclick="cikisYap()" class="btn-logout"><i class="ph ph-sign-out"></i> Çıkış</button>
        </div>
    </header>

    <div class="app-body">
        <aside class="sidebar">
            <div class="nav-menu">
                <a href="danisan-panel.html" class="nav-link"><i class="ph ph-squares-four"></i> Panel</a>
                <a href="danisan-gecmis.html" class="nav-link active"><i class="ph ph-clock-counter-clockwise"></i> Geçmiş</a>
                <a href="bildirimler.html" class="nav-link">
                    <i class="ph ph-bell"></i> Bildirimler
                    <span class="menu-badge" id="menuBadge" style="display:none;">0</span>
                </a>
                <a href="danisan-profil.html" class="nav-link"><i class="ph ph-user-circle"></i> Profilim</a>
            </div>
        </aside>

        <main class="main-wrapper">
            <div class="panel-container">
                <div class="page-header">
                    <div class="page-title">
                        <h1>Geçmiş Görüşmelerim</h1>
                        <p>Uzmanlarınızla daha önce yaptığınız tüm görüşmeler.</p>
                    </div>
                </div>

                <!-- Filtre Bar -->
                <div class="filter-bar">
                    <select id="tarihFiltre" onchange="listeyiFiltrele()">
                        <option value="tumu">Tüm Zamanlar</option>
                        <option value="bugun">Bugün</option>
                        <option value="hafta">Son 7 Gün</option>
                        <option value="ay">Son 30 Gün</option>
                    </select>
                    <div class="search-input-wrap">
                        <i class="ph ph-magnifying-glass"></i>
                        <input type="text" id="aramaGirdisi" placeholder="Uzman adı veya oda kodu ile ara..." onkeyup="listeyiFiltrele()">
                    </div>
                </div>

                <div class="result-count" id="resultCount"></div>

                <div class="history-container" id="gecmisListesi">
                    <div class="empty-state">
                        <i class="ph ph-spinner ph-spin"></i>
                        <p>Geçmiş görüşmeler yükleniyor...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCd0Qlv5o4iszdXoafF2w5UA8n5ZQMQK58",
            authDomain: "uzmanoda.firebaseapp.com",
            projectId: "uzmanoda",
            storageBucket: "uzmanoda.firebasestorage.app",
            messagingSenderId: "71880478784",
            appId: "1:71880478784:web:6934d6ebfd49d46d51cfa5"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let aktifDanisanId = null;
        let tumGorusmeler = [];
        let unsubBildirim = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                aktifDanisanId = user.uid;
                db.collection('danisanlar').doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById('profilIsim').innerText = data.isim + " " + data.soyisim;
                        if (data.fotoBase64) {
                            document.getElementById('profilAvatar').innerHTML = `<img src="${data.fotoBase64}">`;
                        } else {
                            document.getElementById('profilAvatar').innerText = data.isim.charAt(0).toUpperCase();
                        }
                    }
                });
                bildirimSayaciDinle();
                gecmisiYukle();
            } else {
                window.location.href = "danisan-giris.html";
            }
        });

        function bildirimSayaciDinle() {
            if (unsubBildirim) unsubBildirim();
            unsubBildirim = db.collection('bildirimler')
                .where('aliciId', '==', aktifDanisanId)
                .where('okundu', '==', false)
                .onSnapshot(snapshot => {
                    const count = snapshot.size;
                    const badge = document.getElementById('notifBadge');
                    const menuBadge = document.getElementById('menuBadge');
                    badge.innerText = count;
                    badge.classList.toggle('show', count > 0);
                    menuBadge.innerText = count;
                    menuBadge.style.display = count > 0 ? 'inline-block' : 'none';
                });
        }

        function gecmisiYukle() {
            db.collection('gorusmeler')
                .where('danisanId', '==', aktifDanisanId)
                .onSnapshot((snapshot) => {
                    tumGorusmeler = [];
                    snapshot.forEach(doc => tumGorusmeler.push({ id: doc.id, ...doc.data() }));
                    tumGorusmeler.sort((a, b) => {
                        const tA = a.olusturmaTarihi ? a.olusturmaTarihi.toMillis() : 0;
                        const tB = b.olusturmaTarihi ? b.olusturmaTarihi.toMillis() : 0;
                        return tB - tA;
                    });
                    listeyiFiltrele();
                }, (error) => {
                    console.error("Geçmiş hatası:", error);
                });
        }

        function listeyiFiltrele() {
            const tarihFiltre = document.getElementById('tarihFiltre').value;
            const arama = document.getElementById('aramaGirdisi').value.toLowerCase().trim();
            const simdi = new Date();

            const filtreli = tumGorusmeler.filter(g => {
                // Tarih filtresi
                if (tarihFiltre !== 'tumu' && g.olusturmaTarihi) {
                    const t = g.olusturmaTarihi.toDate ? g.olusturmaTarihi.toDate() : new Date(g.olusturmaTarihi);
                    let sinir = new Date();
                    if (tarihFiltre === 'bugun') {
                        sinir.setHours(0,0,0,0);
                    } else if (tarihFiltre === 'hafta') {
                        sinir.setDate(simdi.getDate() - 7);
                    } else if (tarihFiltre === 'ay') {
                        sinir.setDate(simdi.getDate() - 30);
                    }
                    if (t < sinir) return false;
                }

                // Arama filtresi
                if (arama) {
                    const uzmanIsim = (g.uzmanIsim || '').toLowerCase();
                    const kod = (g.odaKodu || g.id.substring(0,6)).toLowerCase();
                    if (!uzmanIsim.includes(arama) && !kod.includes(arama)) return false;
                }

                return true;
            });

            document.getElementById('resultCount').innerText = 
                filtreli.length + ' görüşme bulundu' + 
                (arama || tarihFiltre !== 'tumu' ? ' (filtrelenmiş)' : '');

            listeyiCiz(filtreli);
        }

        function listeyiCiz(gorusmeler) {
            const container = document.getElementById('gecmisListesi');
            container.innerHTML = '';

            if (gorusmeler.length === 0) {
                container.innerHTML = `<div class="empty-state">
                    <i class="ph ph-clock-counter-clockwise"></i>
                    <p>${tumGorusmeler.length === 0 ? 'Henüz geçmiş bir görüşmeniz bulunmuyor.' : 'Arama kriterlerinize uygun görüşme bulunamadı.'}</p>
                </div>`;
                return;
            }

            gorusmeler.forEach(gorusme => {
                let tarihStr = "Bilinmiyor";
                if(gorusme.olusturmaTarihi) {
                    tarihStr = gorusme.olusturmaTarihi.toDate().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute:'2-digit' });
                }
                const uzmanIsim = gorusme.uzmanIsim || gorusme.hostIsim || "Uzman";
                const sure = gorusme.sure || "Bilinmiyor";
                const kod = gorusme.odaKodu || gorusme.id.substring(0,6).toUpperCase();

                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="history-info">
                        <div class="history-icon"><i class="ph ph-user"></i></div>
                        <div class="history-details">
                            <h4>${uzmanIsim} ile Görüşme</h4>
                            <p><i class="ph ph-hash"></i> Oda: ${kod}</p>
                        </div>
                    </div>
                    <div class="history-meta">
                        <span class="date">${tarihStr}</span>
                        <span class="duration"><i class="ph ph-timer"></i> ${sure}</span>
                    </div>
                    <div class="status-badge">Tamamlandı</div>
                `;
                container.appendChild(card);
            });
        }

        function cikisYap() {
            auth.signOut().then(() => {
                window.location.href = "index.html";
            });
        }
    </script>
</body>
</html>
