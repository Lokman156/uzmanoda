<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UzmanOda | Danışanlarım</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #7B2CBF; 
            --pink-light: #FDF2F8;
            --purple-light: #F3E8FF;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
            --surface: #FFFFFF;
            --border: #E5E7EB;
            --success: #10B981;
            --danger: #EF4444;
            --radius-lg: 24px;
            --radius-md: 12px;
            --nav-height: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        html, body { overflow-x: hidden; background-color: #FAFAFA; color: var(--text-dark); min-height: 100vh; }

        /* --- ÜST NAVBAR --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--nav-height);
            background: var(--surface); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; z-index: 1000;
        }
        .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--primary); font-size: 22px; font-weight: 800; }
        .nav-logo img { height: 36px; border-radius: 8px; }
        
        .nav-actions { display: flex; align-items: center; gap: 20px; }
        
        .user-info-nav { display: flex; align-items: center; gap: 10px; }
        .avatar-nav { width: 36px; height: 36px; background: var(--purple-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
        .user-name { font-size: 15px; font-weight: 700; color: var(--text-dark); }

        .btn-logout {
            display: flex; align-items: center; gap: 6px;
            background: #FEE2E2; color: var(--danger); border: none;
            padding: 8px 16px; border-radius: var(--radius-md); font-weight: 700; font-size: 14px;
            cursor: pointer; transition: 0.2s;
        }
        .btn-logout:hover { background: var(--danger); color: white; }

        /* --- UYGULAMA GÖVDESİ --- */
        .app-body { display: flex; margin-top: var(--nav-height); min-height: calc(100vh - var(--nav-height)); }

        /* --- SOL MENÜ (SIDEBAR) --- */
        .sidebar {
            width: 260px; background: var(--surface); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 24px;
            position: fixed; top: var(--nav-height); bottom: 0; left: 0; z-index: 100;
        }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 14px 16px;
            color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 15px;
            border-radius: var(--radius-md); transition: 0.2s;
        }
        .nav-link:hover, .nav-link.active { background: var(--purple-light); color: var(--primary); }
        .nav-link i { font-size: 20px; }

        /* --- ANA İÇERİK --- */
        .main-wrapper { flex: 1; margin-left: 260px; padding: 40px; background: linear-gradient(135deg, #FDF2F8 0%, #F3E8FF 100%); }
        .panel-container { max-width: 1000px; margin: 0 auto; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .page-title h1 { font-size: 28px; font-weight: 800; color: var(--text-dark); margin-bottom: 6px; }
        .page-title p { color: var(--text-muted); font-size: 15px; }

        .btn-add {
            background: linear-gradient(135deg, #7B2CBF, #C77DFF); color: white; border: none;
            padding: 14px 24px; border-radius: var(--radius-md); font-weight: 700; font-size: 15px;
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(123, 44, 191, 0.3);
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(123, 44, 191, 0.4); }

        /* --- ARAMA ÇUBUĞU --- */
        .search-wrapper {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); display: flex; align-items: center;
            padding: 12px 20px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }
        .search-wrapper i { color: var(--text-muted); font-size: 20px; margin-right: 12px; }
        .search-wrapper input { border: none; background: transparent; width: 100%; outline: none; font-size: 16px; color: var(--text-dark); }

        /* --- DANIŞAN LİSTESİ --- */
        .list-container { display: flex; flex-direction: column; gap: 12px; }
        
        .list-item {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
            transition: 0.2s;
        }
        .list-item:hover { border-color: var(--primary); box-shadow: 0 4px 12px rgba(123, 44, 191, 0.05); }
        
        .user-info { display: flex; align-items: center; gap: 16px; }
        .avatar-list { width: 48px; height: 48px; background: var(--purple-light); color: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
        .user-details h4 { font-size: 16px; color: var(--text-dark); font-weight: 700; margin-bottom: 4px; }
        .user-details p { font-size: 13px; color: var(--text-muted); }
        
        .list-actions { display: flex; align-items: center; gap: 12px; }
        
        .btn-notify {
            background: #DBEAFE; color: #3B82F6; border: none; padding: 10px 16px;
            border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .btn-notify:hover { background: #BFDBFE; }
        
        .btn-delete { background: transparent; border: 1px solid var(--border); width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--danger); transition: 0.2s; }
        .btn-delete:hover { background: #FEE2E2; border-color: var(--danger); }

        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); background: var(--surface); border-radius: var(--radius-md); border: 1px dashed var(--border); }

        /* --- MODAL (YENİ DANIŞAN EKLEME) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--surface); padding: 30px; border-radius: var(--radius-lg);
            width: 90%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 20px; font-weight: 800; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); }
        
        .modal-input { width: 100%; padding: 12px 16px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: var(--radius-md); outline: none; }
        .modal-input:focus { border-color: var(--primary); }
        .btn-save { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; }

        /* --- MOBİL UYUMLULUK --- */
        @media (max-width: 768px) {
            .top-navbar { padding: 0 15px; }
            .user-name { display: none; }
            .btn-logout { padding: 8px 12px; font-size: 13px; }
            
            .app-body { flex-direction: column; }
            .sidebar { 
                width: 100%; height: 70px; position: fixed; bottom: 0; top: auto; 
                flex-direction: row; justify-content: space-around; align-items: center; 
                padding: 10px; border-right: none; border-top: 1px solid var(--border); 
                z-index: 1000; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
            }
            .nav-menu { flex-direction: row; gap: 0; width: 100%; justify-content: space-around; }
            .nav-link { flex-direction: column; padding: 8px; font-size: 11px; gap: 4px; text-align: center; margin-bottom: 0; }
            .nav-link i { font-size: 24px; }
            
            .main-wrapper { margin-left: 0; padding: 20px; padding-bottom: 90px; }
            .page-header { flex-direction: column; align-items: flex-start; }
            .btn-add { width: 100%; justify-content: center; }
            .list-item { flex-direction: column; align-items: flex-start; gap: 16px; }
            .list-actions { width: 100%; justify-content: space-between; }
            .btn-notify { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- ÜST NAVBAR -->
    <header class="top-navbar">
        <a href="index.html" class="nav-logo">
            <img src="https://i.hizliresim.com/ujivotuh.png" alt="UzmanOda Logo">
            UzmanOda
        </a>
        <div class="nav-actions">
            <div class="user-info-nav">
                <div class="avatar-nav" id="profilAvatar">U</div>
                <span class="user-name" id="profilIsim">Yükleniyor...</span>
            </div>
            <button onclick="cikisYap()" class="btn-logout">
                <i class="ph ph-sign-out"></i> Çıkış Yap
            </button>
        </div>
    </header>

    <!-- UYGULAMA GÖVDESİ -->
    <div class="app-body">
        
        <!-- SOL MENÜ -->
        <aside class="sidebar">
            <div class="nav-menu">
                <a href="uzman-panel.html" class="nav-link">
                    <i class="ph ph-squares-four"></i> Panel
                </a>
                <a href="danisanlarim.html" class="nav-link active">
                    <i class="ph ph-users"></i> Danışanlarım
                </a>
                <a href="testlerim.html" class="nav-link">
                    <i class="ph ph-exam"></i> Testlerim
                </a>
                <a href="gecmis.html" class="nav-link">
                    <i class="ph ph-clock-counter-clockwise"></i> Geçmiş
                </a>
            </div>
        </aside>

        <!-- ANA İÇERİK -->
        <main class="main-wrapper">
            <div class="panel-container">
                
                <div class="page-header">
                    <div class="page-title">
                        <h1>Danışanlarım</h1>
                        <p>Danışanlarınızı yönetin ve onlara bildirim gönderin.</p>
                    </div>
                    <button class="btn-add" onclick="modalAc()">
                        <i class="ph ph-plus"></i> Yeni Danışan Ekle
                    </button>
                </div>

                <!-- ARAMA ÇUBUĞU -->
                <div class="search-wrapper">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" id="aramaGirdisi" placeholder="İsim veya e-posta ile arayın..." onkeyup="listeyiFiltrele()">
                </div>

                <!-- DANIŞAN LİSTESİ -->
                <div class="list-container" id="danisanListesi">
                    <div class="empty-state">
                        <i class="ph ph-spinner ph-spin" style="font-size: 32px; margin-bottom: 10px;"></i>
                        <p>Danışanlar yükleniyor...</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- YENİ DANIŞAN EKLEME MODALI -->
    <div class="modal-overlay" id="eklemeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Danışan Ekle</h3>
                <button class="modal-close" onclick="modalKapat()">&times;</button>
            </div>
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">Danışanın sisteme kayıtlı e-posta adresini girin.</p>
            <input type="email" id="yeniDanisanEmail" class="modal-input" placeholder="ornek@mail.com">
            <button class="btn-save" onclick="danisanEkle()">Danışanı Ekle</button>
        </div>
    </div>

    <!-- MOTOR (GERÇEK FIREBASE ENTEGRASYONU) -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCd0Qlv5o4iszdXoafF2w5UA8n5ZQMQK58",
            authDomain: "uzmanoda.firebaseapp.com",
            projectId: "uzmanoda",
            storageBucket: "uzmanoda.firebasestorage.app",
            messagingSenderId: "71880478784",
            appId: "1:71880478784:web:6934d6ebfd49d46d51cfa5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let aktifUzmanId = null;
        let tumDanisanlar = []; 
        let unsubDanisanlar = null; 

        // 1. GÜVENLİK DUVARI
        auth.onAuthStateChanged((user) => {
            if (user) {
                aktifUzmanId = user.uid;
                
                db.collection('uzmanlar').doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById('profilIsim').innerText = data.isim;
                        document.getElementById('profilAvatar').innerText = data.isim.charAt(0).toUpperCase();
                    }
                });

                danisanlariDinle();

            } else {
                window.location.href = "uzman-giris.html";
            }
        });

        // 2. DANIŞANLARI CANLI DİNLE
        function danisanlariDinle() {
            if(unsubDanisanlar) unsubDanisanlar(); 

            unsubDanisanlar = db.collection('uzmanDanisanlari')
                .where('uzmanId', '==', aktifUzmanId)
                .onSnapshot((snapshot) => {
                    tumDanisanlar = [];
                    snapshot.forEach((doc) => {
                        tumDanisanlar.push({
                            id: doc.id, 
                            ...doc.data()
                        });
                    });
                    listeyiCiz(tumDanisanlar);
                }, (error) => {
                    console.error("Dinleme hatası:", error);
                });
        }

        // 3. LİSTEYİ EKRANA ÇİZME
        function listeyiCiz(liste) {
            const container = document.getElementById('danisanListesi');
            container.innerHTML = "";

            if (liste.length === 0) {
                container.innerHTML = `<div class="empty-state">
                    <i class="ph ph-users" style="font-size: 40px; margin-bottom: 10px; opacity: 0.5;"></i>
                    <p>Henüz danışan bulunmuyor. Sağ üstten yeni danışan ekleyin.</p>
                </div>`;
                return;
            }

            liste.forEach(danisan => {
                const isim = danisan.danisanIsim || "İsimsiz";
                const email = danisan.danisanEmail || "E-posta yok";
                const basHarf = isim.charAt(0).toUpperCase();

                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <div class="user-info">
                        <div class="avatar-list">${basHarf}</div>
                        <div class="user-details">
                            <h4>${isim}</h4>
                            <p>${email}</p>
                        </div>
                    </div>
                    <div class="list-actions">
                        <button class="btn-notify" onclick="bildirimGonder('${danisan.danisanId}', '${isim}')">
                            <i class="ph ph-paper-plane-right"></i> Bildirim Gönder
                        </button>
                        <button class="btn-delete" onclick="danisanSil('${danisan.id}', '${isim}')">
                            <i class="ph ph-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 4. ARAMA FONKSİYONU
        function listeyiFiltrele() {
            const arama = document.getElementById('aramaGirdisi').value.toLowerCase();
            const filtrelenmis = tumDanisanlar.filter(d => {
                const isim = (d.danisanIsim || "").toLowerCase();
                const email = (d.danisanEmail || "").toLowerCase();
                return isim.includes(arama) || email.includes(arama);
            });
            listeyiCiz(filtrelenmis);
        }

        // 5. DANIŞAN SİLME
        function danisanSil(docId, isim) {
            if (confirm(isim + " isimli danışanı listenizden silmek istediğinize emin misiniz?\n\n(Danışanın sistemdeki hesabı silinmez, sadece sizin listenizden kaldırılır.)")) {
                db.collection('uzmanDanisanlari').doc(docId).delete()
                .then(() => {
                    // onSnapshot sayesinde liste anında güncellenecek
                })
                .catch((error) => {
                    console.error("Silme hatası:", error);
                    alert("Danışan silinirken bir hata oluştu: " + error.message);
                });
            }
        }

        // 6. YENİ DANIŞAN EKLEME
        async function danisanEkle() {
            const email = document.getElementById('yeniDanisanEmail').value.trim().toLowerCase();
            
            if (!email) {
                alert("Lütfen bir e-posta adresi girin.");
                return;
            }

            const btn = document.querySelector('.btn-save');
            btn.innerText = "Aranıyor...";
            btn.disabled = true;

            try {
                const danisanSorgu = await db.collection('danisanlar').where('email', '==', email).get();

                if (danisanSorgu.empty) {
                    alert("Bu e-posta adresine sahip bir danışan bulunamadı. Danışanın önce sisteme kayıt olması gerekir.");
                    btn.innerText = "Danışanı Ekle";
                    btn.disabled = false;
                    return;
                }

                const danisanData = danisanSorgu.docs[0].data();
                const danisanId = danisanSorgu.docs[0].id;

                const zatenEkli = await db.collection('uzmanDanisanlari')
                    .where('uzmanId', '==', aktifUzmanId)
                    .where('danisanId', '==', danisanId)
                    .get();

                if (!zatenEkli.empty) {
                    alert("Bu danışan zaten listenizde kayıtlı.");
                    btn.innerText = "Danışanı Ekle";
                    btn.disabled = false;
                    return;
                }

                await db.collection('uzmanDanisanlari').add({
                    uzmanId: aktifUzmanId,
                    danisanId: danisanId,
                    danisanIsim: danisanData.isim + " " + danisanData.soyisim,
                    danisanEmail: danisanData.email,
                    eklenmeTarihi: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Danışan başarıyla listenize eklendi.");
                modalKapat();
                document.getElementById('yeniDanisanEmail').value = "";

            } catch (error) {
                console.error("Ekleme hatası:", error);
                alert("Bir hata oluştu: " + error.message);
            } finally {
                btn.innerText = "Danışanı Ekle";
                btn.disabled = false;
            }
        }

        // 7. BİLDİRİM GÖNDERME
        async function bildirimGonder(danisanId, isim) {
            const mesaj = prompt(isim + " isimli danışana göndermek istediğiniz mesajı yazın:");
            
            if (mesaj && mesaj.trim() !== "") {
                try {
                    await db.collection('bildirimler').add({
                        aliciId: danisanId,
                        gonderenId: aktifUzmanId,
                        baslik: "Uzmanınızdan Mesaj Var",
                        mesaj: mesaj,
                        okundu: false,
                        tarih: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert("Bildirim başarıyla gönderildi!");
                } catch (error) {
                    console.error("Bildirim hatası:", error);
                    alert("Bildirim gönderilirken hata oluştu.");
                }
            }
        }

        // 8. MODAL AÇ / KAPAT
        function modalAc() { document.getElementById('eklemeModal').classList.add('active'); }
        function modalKapat() { document.getElementById('eklemeModal').classList.remove('active'); }

        // 9. ÇIKIŞ YAP
        function cikisYap() {
            auth.signOut().then(() => {
                window.location.href = "index.html";
            });
        }
    </script>
</body>
</html>
