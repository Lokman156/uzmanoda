<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UzmanOda | Danışanlarım</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #7B2CBF; 
            --pink-light: #FDF2F8;
            --purple-light: #F3E8FF;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
            --surface: #FFFFFF;
            --border: #E5E7EB;
            --success: #10B981;
            --radius-lg: 24px;
            --radius-md: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        html, body { overflow-x: hidden; background-color: #FAFAFA; color: var(--text-dark); display: flex; min-height: 100vh; }

        /* --- SOL MENÜ --- */
        .sidebar {
            width: 260px; background: var(--surface); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 24px;
            position: fixed; height: 100vh; z-index: 100;
        }
        .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--primary); font-size: 22px; font-weight: 800; margin-bottom: 40px; }
        .nav-logo img { height: 36px; border-radius: 8px; }
        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 14px 16px;
            color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 15px;
            border-radius: var(--radius-md); margin-bottom: 8px; transition: 0.2s;
        }
        .nav-link:hover, .nav-link.active { background-color: var(--purple-light); color: var(--primary); }
        .nav-link i { font-size: 20px; }
        .user-profile { margin-top: auto; display: flex; align-items: center; gap: 12px; padding-top: 20px; border-top: 1px solid var(--border); }
        .user-avatar { width: 40px; height: 40px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* --- ANA İÇERİK --- */
        .main-wrapper { flex: 1; margin-left: 260px; padding: 40px; background: linear-gradient(135deg, #FDF2F8 0%, #F3E8FF 100%); min-height: 100vh; }
        .panel-container { max-width: 1100px; margin: 0 auto; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .page-title h1 { font-size: 28px; font-weight: 800; color: var(--text-dark); margin-bottom: 6px; }
        .page-title p { color: var(--text-muted); font-size: 15px; }

        .btn-add {
            background: linear-gradient(135deg, #7B2CBF, #C77DFF); color: white; border: none;
            padding: 14px 24px; border-radius: var(--radius-md); font-weight: 700; font-size: 15px;
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(123, 44, 191, 0.3);
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(123, 44, 191, 0.4); }

        /* --- ARAMA ÇUBUĞU --- */
        .search-wrapper {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); display: flex; align-items: center;
            padding: 12px 20px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }
        .search-wrapper i { color: var(--text-muted); font-size: 20px; margin-right: 12px; }
        .search-wrapper input {
            border: none; background: transparent; width: 100%; outline: none;
            font-size: 16px; color: var(--text-dark);
        }

        /* --- DANIŞAN LİSTESİ --- */
        .list-container { display: flex; flex-direction: column; gap: 12px; }
        
        .list-item {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between;
            transition: 0.2s;
        }
        .list-item:hover { border-color: var(--primary); box-shadow: 0 4px 12px rgba(123, 44, 191, 0.05); }
        
        .user-info { display: flex; align-items: center; gap: 16px; }
        .avatar { width: 48px; height: 48px; background: var(--purple-light); color: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
        .user-details h4 { font-size: 16px; color: var(--text-dark); font-weight: 700; margin-bottom: 4px; }
        .user-details p { font-size: 13px; color: var(--text-muted); }
        
        .list-actions { display: flex; align-items: center; gap: 12px; }
        
        .btn-notify {
            background: #DBEAFE; color: #3B82F6; border: none; padding: 10px 16px;
            border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .btn-notify:hover { background: #BFDBFE; }
        
        .btn-delete { background: transparent; border: 1px solid var(--border); width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #EF4444; transition: 0.2s; }
        .btn-delete:hover { background: #FEE2E2; border-color: #EF4444; }

        /* --- MODAL (YENİ DANIŞAN EKLEME) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--surface); padding: 30px; border-radius: var(--radius-lg);
            width: 90%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 20px; font-weight: 800; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); }
        
        .modal-input {
            width: 100%; padding: 12px 16px; margin-bottom: 16px;
            border: 1px solid var(--border); border-radius: var(--radius-md); outline: none;
        }
        .modal-input:focus { border-color: var(--primary); }
        .btn-save { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; }

        /* --- MOBİL UYUMLULUK --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; justify-content: space-between; align-items: center; padding: 15px 20px; border-right: none; border-bottom: 1px solid var(--border); }
            .nav-logo { margin-bottom: 0; }
            .nav-link, .user-profile { display: none; }
            .main-wrapper { margin-left: 0; padding: 20px; }
            
            .page-header { flex-direction: column; align-items: flex-start; }
            .btn-add { width: 100%; justify-content: center; }
            
            .list-item { flex-direction: column; align-items: flex-start; gap: 16px; }
            .list-actions { width: 100%; justify-content: space-between; }
            .btn-notify { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- SOL MENÜ -->
    <aside class="sidebar">
        <a href="index.html" class="nav-logo">
            <img src="https://i.hizliresim.com/ujivotuh.png" alt="UzmanOda Logo">
            UzmanOda
        </a>
        
        <div style="display: flex; flex-direction: column; flex: 1;">
            <a href="uzman-panel.html" class="nav-link">
                <i class="ph ph-squares-four"></i> Panel
            </a>
            <a href="danisanlarim.html" class="nav-link active">
                <i class="ph ph-users"></i> Danışanlarım
            </a>
            <a href="testlerim.html" class="nav-link">
                <i class="ph ph-exam"></i> Testlerim
            </a>
        </div>

        <div class="user-profile">
            <div class="user-avatar" id="profilAvatar">U</div>
            <div class="user-info">
                <h4 id="profilIsim">Yükleniyor...</h4>
            </div>
        </div>
    </aside>

    <!-- ANA İÇERİK -->
    <main class="main-wrapper">
        <div class="panel-container">
            
            <div class="page-header">
                <div class="page-title">
                    <h1>Danışanlarım</h1>
                    <p>Danışanlarınızı yönetin, arayın ve onlara bildirim gönderin.</p>
                </div>
                <button class="btn-add" onclick="modalAc()">
                    <i class="ph ph-plus"></i> Yeni Danışan Ekle
                </button>
            </div>

            <!-- ARAMA ÇUBUĞU -->
            <div class="search-wrapper">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="aramaGirdisi" placeholder="İsim veya e-posta ile arayın..." onkeyup="listeyiFiltrele()">
            </div>

            <!-- DANIŞAN LİSTESİ -->
            <div class="list-container" id="danisanListesi">
                <!-- JS ile burası dolacak -->
                <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                    <i class="ph ph-spinner ph-spin" style="font-size: 32px; margin-bottom: 10px;"></i>
                    <p>Danışanlar yükleniyor...</p>
                </div>
            </div>

        </div>
    </main>

    <!-- YENİ DANIŞAN EKLEME MODALI -->
    <div class="modal-overlay" id="eklemeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Danışan Ekle</h3>
                <button class="modal-close" onclick="modalKapat()">&times;</button>
            </div>
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">Danışanın sisteme kayıtlı e-posta adresini girin.</p>
            <input type="email" id="yeniDanisanEmail" class="modal-input" placeholder="ornek@mail.com">
            <button class="btn-save" onclick="danisanEkle()">Danışanı Ekle</button>
        </div>
    </div>

    <!-- MOTOR (FIREBASE VE MANTIK) -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCd0Qlv5o4iszdXoafF2w5UA8n5ZQMQK58",
            authDomain: "uzmanoda.firebaseapp.com",
            projectId: "uzmanoda",
            storageBucket: "uzmanoda.firebasestorage.app",
            messagingSenderId: "71880478784",
            appId: "1:71880478784:web:6934d6ebfd49d46d51cfa5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let aktifUzmanId = null;
        let tumDanisanlar = []; // Arama yaparken kullanmak için

        // 1. GÜVENLİK DUVARI VE KULLANICIYI TANIMA
        auth.onAuthStateChanged((user) => {
            if (user) {
                aktifUzmanId = user.uid;
                
                // Profil bilgisini çek
                db.collection('uzmanlar').doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById('profilIsim').innerText = data.isim;
                        document.getElementById('profilAvatar').innerText = data.isim.charAt(0).toUpperCase();
                    }
                });

                // Danışanları yükle
                danisanlariYukle();

            } else {
                window.location.href = "uzman-giris.html";
            }
        });

        // 2. DANIŞANLARI VERİTABANINDAN ÇEKME (Şimdilik temsili verilerle test ediyoruz)
        // NOT: Gerçekte burada Firebase'den sorgu atacağız, şimdilik arayüzü görmen için sahte veri ekliyorum.
        function danisanlariYukle() {
            // Firebase'den çekilene kadar temsili liste
            tumDanisanlar = [
                { id: "1", isim: "Ahmet Yılmaz", email: "ahmet@gmail.com", basHarf: "AY" },
                { id: "2", isim: "Zeynep Kaya", email: "zeynep@hotmail.com", basHarf: "ZK" },
                { id: "3", isim: "Can Demir", email: "can.demir@outlook.com", basHarf: "CD" }
            ];
            listeyiCiz(tumDanisanlar);
        }

        // 3. LİSTEYİ EKRANA ÇİZME
        function listeyiCiz(liste) {
            const container = document.getElementById('danisanListesi');
            container.innerHTML = "";

            if (liste.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-muted);">
                    <i class="ph ph-users" style="font-size: 40px; margin-bottom: 10px; opacity: 0.5;"></i>
                    <p>Henüz danışan bulunmuyor.</p>
                </div>`;
                return;
            }

            liste.forEach(danisan => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <div class="user-info">
                        <div class="avatar">${danisan.basHarf}</div>
                        <div class="user-details">
                            <h4>${danisan.isim}</h4>
                            <p>${danisan.email}</p>
                        </div>
                    </div>
                    <div class="list-actions">
                        <button class="btn-notify" onclick="bildirimGonder('${danisan.isim}')">
                            <i class="ph ph-paper-plane-right"></i> Bildirim Gönder
                        </button>
                        <button class="btn-delete" onclick="danisanSil('${danisan.id}')">
                            <i class="ph ph-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 4. ARAMA FONKSİYONU
        function listeyiFiltrele() {
            const arama = document.getElementById('aramaGirdisi').value.toLowerCase();
            const filtrelenmis = tumDanisanlar.filter(d => 
                d.isim.toLowerCase().includes(arama) || d.email.toLowerCase().includes(arama)
            );
            listeyiCiz(filtrelenmis);
        }

        // 5. BİLDİRİM GÖNDERME (Şimdilik uyarı)
        function bildirimGonder(isim) {
            alert(isim + " isimli danışana site içi bildirim gönderildi! (Firebase entegrasyonu ile gerçekleşecek)");
        }

        // 6. MODAL AÇ / KAPAT
        function modalAc() { document.getElementById('eklemeModal').classList.add('active'); }
        function modalKapat() { document.getElementById('eklemeModal').classList.remove('active'); }

        // 7. YENİ DANIŞAN EKLEME
        function danisanEkle() {
            const email = document.getElementById('yeniDanisanEmail').value;
            if(email) {
                alert("E-posta kontrol ediliyor... " + email + " sisteme kayıtlıysa eklenecek.");
                modalKapat();
                document.getElementById('yeniDanisanEmail').value = "";
            }
        }
    </script>
</body>
</html>
