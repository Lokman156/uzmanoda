<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UzmanOda | Testlerim</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #7B2CBF; 
            --pink-light: #FDF2F8;
            --purple-light: #F3E8FF;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
            --surface: #FFFFFF;
            --border: #E5E7EB;
            --success: #10B981;
            --radius-lg: 24px;
            --radius-md: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        html, body { overflow-x: hidden; background-color: #FAFAFA; color: var(--text-dark); display: flex; min-height: 100vh; }

        /* --- SOL MENÜ --- */
        .sidebar {
            width: 260px; background: var(--surface); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; padding: 24px;
            position: fixed; height: 100vh; z-index: 100;
        }
        .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--primary); font-size: 22px; font-weight: 800; margin-bottom: 40px; }
        .nav-logo img { height: 36px; border-radius: 8px; }
        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 14px 16px;
            color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 15px;
            border-radius: var(--radius-md); margin-bottom: 8px; transition: 0.2s;
        }
        .nav-link:hover, .nav-link.active { background-color: var(--purple-light); color: var(--primary); }
        .nav-link i { font-size: 20px; }
        .user-profile { margin-top: auto; display: flex; align-items: center; gap: 12px; padding-top: 20px; border-top: 1px solid var(--border); }
        .user-avatar { width: 40px; height: 40px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* --- ANA İÇERİK --- */
        .main-wrapper { flex: 1; margin-left: 260px; padding: 40px; background: linear-gradient(135deg, #FDF2F8 0%, #F3E8FF 100%); min-height: 100vh; }
        .panel-container { max-width: 1100px; margin: 0 auto; }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .page-title h1 { font-size: 28px; font-weight: 800; color: var(--text-dark); margin-bottom: 6px; }
        .page-title p { color: var(--text-muted); font-size: 15px; }

        .btn-add {
            background: linear-gradient(135deg, #7B2CBF, #C77DFF); color: white; border: none;
            padding: 14px 24px; border-radius: var(--radius-md); font-weight: 700; font-size: 15px;
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(123, 44, 191, 0.3);
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(123, 44, 191, 0.4); }

        /* --- TEST KARTLARI (GRID) --- */
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .test-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 24px;
            transition: 0.3s; display: flex; flex-direction: column;
        }
        .test-card:hover { border-color: var(--primary); box-shadow: 0 10px 30px rgba(123, 44, 191, 0.08); transform: translateY(-3px); }

        .test-icon {
            width: 48px; height: 48px; background: var(--purple-light); color: var(--primary);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin-bottom: 20px;
        }
        .test-card h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
        .test-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; flex: 1; }
        
        .test-meta { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 16px; }
        .test-meta span { font-size: 13px; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
        
        .btn-edit { background: transparent; border: none; color: var(--primary); font-weight: 700; cursor: pointer; font-size: 14px; }
        .btn-edit:hover { text-decoration: underline; }

        /* --- MODAL (TEST OLUŞTURMA) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: none; align-items: flex-start; justify-content: center; z-index: 1000;
            padding: 40px 20px; overflow-y: auto;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--surface); padding: 30px; border-radius: var(--radius-lg);
            width: 100%; max-width: 600px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            margin: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 22px; font-weight: 800; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); }
        
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
        .modal-input {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border);
            border-radius: var(--radius-md); outline: none; font-size: 15px;
        }
        .modal-input:focus { border-color: var(--primary); }

        /* Soru Ekleme Alanı */
        .question-box {
            background: #FAFAFA; border: 1px dashed var(--border); padding: 20px;
            border-radius: var(--radius-md); margin-bottom: 16px; position: relative;
        }
        .btn-remove-q { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #EF4444; cursor: pointer; font-size: 18px; }
        
        .option-input-wrapper { display: flex; gap: 10px; margin-top: 10px; }
        
        .btn-add-q {
            width: 100%; padding: 12px; background: var(--purple-light); color: var(--primary);
            border: 1px dashed var(--primary); border-radius: var(--radius-md);
            font-weight: 700; cursor: pointer; margin-bottom: 20px; transition: 0.2s;
        }
        .btn-add-q:hover { background: #E0AAFF; }

        .btn-save { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn-save:hover { background: #5a189a; }

        /* --- MOBİL UYUMLULUK --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; justify-content: space-between; align-items: center; padding: 15px 20px; border-right: none; border-bottom: 1px solid var(--border); }
            .nav-logo { margin-bottom: 0; }
            .nav-link, .user-profile { display: none; }
            .main-wrapper { margin-left: 0; padding: 20px; }
            
            .page-header { flex-direction: column; align-items: flex-start; }
            .btn-add { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- SOL MENÜ -->
    <aside class="sidebar">
        <a href="index.html" class="nav-logo">
            <img src="https://i.hizliresim.com/ujivotuh.png" alt="UzmanOda Logo">
            UzmanOda
        </a>
        
        <div style="display: flex; flex-direction: column; flex: 1;">
            <a href="uzman-panel.html" class="nav-link">
                <i class="ph ph-squares-four"></i> Panel
            </a>
            <a href="danisanlarim.html" class="nav-link">
                <i class="ph ph-users"></i> Danışanlarım
            </a>
            <a href="testlerim.html" class="nav-link active">
                <i class="ph ph-exam"></i> Testlerim
            </a>
        </div>

        <div class="user-profile">
            <div class="user-avatar" id="profilAvatar">U</div>
            <div class="user-info">
                <h4 id="profilIsim">Yükleniyor...</h4>
            </div>
        </div>
    </aside>

    <!-- ANA İÇERİK -->
    <main class="main-wrapper">
        <div class="panel-container">
            
            <div class="page-header">
                <div class="page-title">
                    <h1>Testlerim</h1>
                    <p>Danışanlarınıza göndermek için testler oluşturun ve yönetin.</p>
                </div>
                <button class="btn-add" onclick="modalAc()">
                    <i class="ph ph-plus"></i> Yeni Test Oluştur
                </button>
            </div>

            <!-- TEST LİSTESİ -->
            <div class="test-grid" id="testListesi">
                <!-- JS ile burası dolacak -->
                <div style="text-align: center; padding: 40px; color: var(--text-muted); grid-column: 1 / -1;">
                    <i class="ph ph-spinner ph-spin" style="font-size: 32px; margin-bottom: 10px;"></i>
                    <p>Testler yükleniyor...</p>
                </div>
            </div>

        </div>
    </main>

    <!-- YENİ TEST OLUŞTURMA MODALI -->
    <div class="modal-overlay" id="testModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Yeni Test Oluştur</h3>
                <button class="modal-close" onclick="modalKapat()">&times;</button>
            </div>
            
            <div class="input-group">
                <label>Test Başlığı</label>
                <input type="text" id="testBaslik" class="modal-input" placeholder="Örn: Stres Değerlendirme Ölçeği">
            </div>
            
            <div class="input-group">
                <label>Açıklama (İsteğe Bağlı)</label>
                <input type="text" id="testAciklama" class="modal-input" placeholder="Danışana gösterilecek kısa açıklama">
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

            <div id="sorularAlani">
                <!-- Sorular buraya eklenecek -->
            </div>

            <button class="btn-add-q" onclick="soruEkle()">
                <i class="ph ph-plus"></i> Yeni Soru Ekle
            </button>

            <button class="btn-save" onclick="testiKaydet()">Testi Kaydet</button>
        </div>
    </div>

    <!-- MOTOR (FIREBASE VE MANTIK) -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCd0Qlv5o4iszdXoafF2w5UA8n5ZQMQK58",
            authDomain: "uzmanoda.firebaseapp.com",
            projectId: "uzmanoda",
            storageBucket: "uzmanoda.firebasestorage.app",
            messagingSenderId: "71880478784",
            appId: "1:71880478784:web:6934d6ebfd49d46d51cfa5"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let aktifUzmanId = null;

        // 1. GÜVENLİK DUVARI
        auth.onAuthStateChanged((user) => {
            if (user) {
                aktifUzmanId = user.uid;
                db.collection('uzmanlar').doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById('profilIsim').innerText = data.isim;
                        document.getElementById('profilAvatar').innerText = data.isim.charAt(0).toUpperCase();
                    }
                });
                testleriYukle();
            } else {
                window.location.href = "uzman-giris.html";
            }
        });

        // 2. TESTLERİ YÜKLE (Şimdilik temsili veriler)
        function testleriYukle() {
            const temsiliTestler = [
                { id: "t1", baslik: "Stres Değerlendirme Ölçeği", aciklama: "Son 1 haftadaki stres durumunuzu ölçer.", soruSayisi: 5 },
                { id: "t2", baslik: "Kaygı Tarama Testi", aciklama: "Genel kaygı seviyesi belirleme.", soruSayisi: 8 }
            ];
            listeyiCiz(temsiliTestler);
        }

        // 3. LİSTEYİ EKRANA ÇİZME
        function listeyiCiz(liste) {
            const container = document.getElementById('testListesi');
            container.innerHTML = "";

            if (liste.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-muted); grid-column: 1 / -1;">
                    <i class="ph ph-exam" style="font-size: 40px; margin-bottom: 10px; opacity: 0.5;"></i>
                    <p>Henüz test oluşturmadınız.</p>
                </div>`;
                return;
            }

            liste.forEach(test => {
                const card = document.createElement('div');
                card.className = 'test-card';
                card.innerHTML = `
                    <div class="test-icon"><i class="ph ph-clipboard-text"></i></div>
                    <h3>${test.baslik}</h3>
                    <p>${test.aciklama}</p>
                    <div class="test-meta">
                        <span><i class="ph ph-list-numbers"></i> ${test.soruSayisi} Soru</span>
                        <button class="btn-edit" onclick="alert('Test düzenleme ekranı yapım aşamasında.')">Düzenle</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 4. MODAL AÇ / KAPAT
        function modalAc() { 
            document.getElementById('testModal').classList.add('active');
            document.getElementById('sorularAlani').innerHTML = ""; // Temizle
            soruEkle(); // İlk soruyu otomatik ekle
        }
        function modalKapat() { document.getElementById('testModal').classList.remove('active'); }

        // 5. DİNAMİK SORU EKLEME
        let soruIndex = 0;
        function soruEkle() {
            const container = document.getElementById('sorularAlani');
            const box = document.createElement('div');
            box.className = 'question-box';
            box.id = 'soru-' + soruIndex;
            
            box.innerHTML = `
                <button class="btn-remove-q" onclick="soruSil('soru-${soruIndex}')"><i class="ph ph-x-circle"></i></button>
                <div class="input-group">
                    <label>Soru ${soruIndex + 1}</label>
                    <input type="text" class="modal-input soru-metin" placeholder="Soruyu yazın...">
                </div>
                <div class="input-group">
                    <label>Seçenekler (Alt alta yazın veya virgülle ayırın)</label>
                    <input type="text" class="modal-input soru-secenek" placeholder="Örn: Hiç, Bazen, Sık Sık, Her Zaman">
                </div>
            `;
            container.appendChild(box);
            soruIndex++;
        }

        function soruSil(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        // 6. TESTİ KAYDETME
        function testiKaydet() {
            const baslik = document.getElementById('testBaslik').value;
            const aciklama = document.getElementById('testAciklama').value;
            
            if(!baslik) {
                alert("Lütfen bir test başlığı girin.");
                return;
            }

            // Soruları topla (Şimdilik sadece console'a yazdırıyoruz)
            const sorular = document.querySelectorAll('.question-box');
            let soruListesi = [];
            
            sorular.forEach((soru, index) => {
                const metin = soru.querySelector('.soru-metin').value;
                const secenekler = soru.querySelector('.soru-secenek').value;
                if(metin) {
                    soruListesi.push({ soru: metin, secenekler: secenekler });
                }
            });

            if(soruListesi.length === 0) {
                alert("En az bir soru eklemelisiniz.");
                return;
            }

            // Firebase'e kaydetme kodu (Birazdan tam bağlanacak)
            alert("Test başarıyla oluşturuldu!\nBaşlık: " + baslik + "\nSoru Sayısı: " + soruListesi.length + "\n\n(Firebase entegrasyonu ile veritabanına kaydedilecek)");
            
            modalKapat();
            document.getElementById('testBaslik').value = "";
            document.getElementById('testAciklama').value = "";
        }
    </script>
</body>
</html>
